<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traced</title>
    <script>
      (function () {
        var segmentCount = 1;
        var location = window.location;
        var origin = location.protocol + "//" + location.hostname + (location.port ? ":" + location.port : "");
        var basePath = location.pathname.split("/").slice(0, 1 + segmentCount).join("/");
        var routePath = location.pathname.slice(1).split("/").slice(segmentCount).join("/");
        var query = location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "";
        var redirectUrl = origin + basePath + "/?/" + routePath.replace(/&/g, "~and~") + query + location.hash;

        location.replace(redirectUrl);
      }());
    </script>
  </head>
  <body></body>
</html>
